# 📄 docker-compose.yml
# 📍 Root of project
# 🧠 Spins up Phantom MVP stack: backend (FastAPI), LightRAG API, and Postgres

version: '3.9'

services:
  phantom-backend:
    build:
      context: ./backend
    container_name: phantom-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - phantom-db
      - lightrag-api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  lightrag-api:
    build:
      context: ./lightrag
    container_name: lightrag-api
    ports:
      - "9621:9621"
    env_file:
      - .env
    command: ["python", "-m", "lightrag.api.server"]

  phantom-db:
    image: postgres:15
    container_name: phantom-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - phantom_db_data:/var/lib/postgresql/data

volumes:
  phantom_db_data:
